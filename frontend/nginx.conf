# nginx: servira React aplikaciju i radi kao reverse proxy ka API-ju.
# Frontend i API su tako na ISTOM origin-u, pa httpOnly refresh cookie (SameSite=Strict) radi bez CORS-a.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Otpremanje do 10 slika po 5 MB.
    client_max_body_size 60m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Prava IP adresa klijenta - API veruje ovom zaglavlju SAMO od pouzdane Docker mreže.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NAPOMENA: nginx ovde završava HTTP (ne TLS sa JA3 modulom), pa X-TLS-Fingerprint ne prosleđujemo.
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        expires 7d;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: sve nepoznate putanje vraćaju index.html (React Router rešava rutu u pregledaču).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
